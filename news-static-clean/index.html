<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南湖新闻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px
        }

        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 15px 0
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .nav-brand {
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center
        }

        .nav-links a {
            color: rgba(255, 255, 255, .9);
            text-decoration: none
        }

        .hero {
            text-align: center;
            padding: 40px 0
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 10px
        }

        .news-card {
            background: #fff;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            display: flex;
            gap: 20px;
            align-items: flex-start
        }

        .news-card-image {
            width: 180px;
            min-height: 120px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            background: #f0f0f0;
            order: 1
        }

        .news-card-image img {
            width: 100%;
            height: auto;
            display: block
        }

        .news-card-body {
            flex: 1;
            min-width: 0
        }

        .news-card h2 {
            margin-bottom: 10px
        }

        .news-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            transform: translateY(-2px);
            transition: all .2s
        }

        .news-card h2 {
            color: #333
        }

        .news-meta {
            color: #999;
            font-size: .85rem;
            margin-bottom: 12px
        }

        .news-summary {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.8
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999
        }

        .form-container {
            max-width: 450px;
            margin: 40px auto;
            background: #fff;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
        }

        .form-wide {
            max-width: 700px
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px
        }

        .form-group {
            margin-bottom: 20px
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea
        }

        .form-group textarea {
            resize: vertical;
            min-height: 200px
        }

        .form-actions {
            display: flex;
            gap: 10px
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #999
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px
        }

        .table {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
        }

        .table thead {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff
        }

        .table th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 500
        }

        .table td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0
        }

        .table tr:hover {
            background: #f8f9ff
        }

        .btn {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid #ddd;
            background: #fff;
            color: #555;
            border-radius: 5px;
            font-size: .9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all .2s
        }

        .btn:hover {
            border-color: #667eea;
            color: #667eea
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none
        }

        .btn-primary:hover {
            opacity: .9;
            color: #fff
        }

        .btn-danger {
            color: #e74c3c;
            border-color: #e74c3c
        }

        .btn-danger:hover {
            background: #e74c3c;
            color: #fff
        }

        .btn-block {
            width: 100%
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: .85rem
        }

        .alert {
            padding: 12px 18px;
            border-radius: 5px;
            margin-bottom: 20px
        }

        .alert-error {
            background: #fde8e8;
            color: #c0392b;
            border: 1px solid #f8d7da
        }

        .news-detail {
            background: #fff;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
        }

        .news-detail h1 {
            font-size: 1.8rem;
            margin-bottom: 15px
        }

        .news-content {
            margin-top: 25px;
            line-height: 2;
            color: #444;
            font-size: 1.05rem
        }

        .news-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 15px
        }

        main {
            padding: 30px 0
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand"><img src="https://dce.jlu.edu.cn/images/logo.png" alt="南湖新闻"
                    style="height:28px"></a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">首页</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <section class="hero">
            <h1>南湖新闻</h1>
            <p>浏览最新的南湖资讯</p>
        </section>
        <section class="news-list" id="newsList"></section>
    </main>
    <script src="index_JS.js"></script>
</body>

</html>
