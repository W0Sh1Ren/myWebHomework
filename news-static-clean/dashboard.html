<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333}
.container{max-width:1000px;margin:0 auto;padding:0 20px}
.navbar{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:15px 0}
.navbar .container{display:flex;justify-content:space-between;align-items:center}
.nav-brand{color:#fff;font-size:1.4rem;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nav-links{display:flex;gap:20px;align-items:center}
.nav-links a{color:rgba(255,255,255,.9);text-decoration:none}
.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.table thead{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.table th{padding:15px 20px;text-align:left;font-weight:500}
.table td{padding:12px 20px;border-bottom:1px solid #f0f0f0}
.table tr:last-child td{border-bottom:none}
.table tr:hover{background:#f8f9ff}
.btn{display:inline-block;padding:8px 18px;border:1px solid #ddd;background:#fff;color:#555;border-radius:5px;font-size:.9rem;cursor:pointer;text-decoration:none;transition:all .2s}
.btn:hover{border-color:#667eea;color:#667eea}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-danger{color:#e74c3c;border-color:#e74c3c}
.btn-danger:hover{background:#e74c3c;color:#fff}
.btn-sm{padding:5px 12px;font-size:.85rem}
.empty-state{text-align:center;padding:60px 20px;color:#999}
main{padding:30px 0}
</style>
</head>
<body>
<nav class="navbar">
<div class="container">
<a href="index.html" class="nav-brand"><img src="https://dce.jlu.edu.cn/images/logo.png" alt="南湖新闻" style="height:28px"></a>
<div class="nav-links" id="navLinks"></div>
</div>
</nav>
<main class="container">
<div class="dashboard-header">
<h2>新闻管理</h2>
<a href="create.html" class="btn btn-primary">发布新闻</a>
</div>
<section id="dashboardContent"></section>
</main>
<script src="dashboard_JS.js"></script>
</body>
</html>
