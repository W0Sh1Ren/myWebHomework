<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
    .navbar { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 15px 0; }
    .navbar .container { display: flex; justify-content: space-between; align-items: center; }
    .nav-brand { color: #fff; font-size: 1.4rem; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    .nav-links a { color: rgba(255,255,255,.9); text-decoration: none; }
    .form-container { max-width: 450px; margin: 40px auto; background: #fff; padding: 35px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .form-container h2 { text-align: center; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: #555; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn { display: inline-block; padding: 8px 18px; border: 1px solid #ddd; border-radius: 5px; font-size: .9rem; cursor: pointer; text-decoration: none; transition: all .2s; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; width: 100%; }
    .btn-primary:hover { opacity: .9; }
    .alert { padding: 12px 18px; border-radius: 5px; margin-bottom: 20px; }
    .alert-error { background: #fde8e8; color: #c0392b; border: 1px solid #f8d7da; }
    .form-footer { text-align: center; margin-top: 20px; color: #999; }
    .form-footer a { color: #667eea; text-decoration: none; }
    main { padding: 30px 0; }
    <div class="container">
      <a href="index.html" class="nav-brand"><img src="https://dce.jlu.edu.cn/images/logo.png" alt="南湖新闻" style="height:28px"></a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="form-container">
      <h2>用户注册</h2>

      <!-- 错误提示区域，默认隐藏 -->
      <div id="error" class="alert alert-error" style="display:none"></div>

      <!-- 注册表单，提交时调用 handleRegister 函数 -->
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" required placeholder="密码至少6位" minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确l>
          <div c认ass="password-wrapper"密码</label>
            <input type="password" id="confirmPassword" required placeholder="请再次输入密码">">
            <button type="button" class="password-toggle" onclick="togglePwd('password', this)" tabindex="-1>显示</button>
          </div
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
      </form>l>

            <button type="button" class="password-toggle" onclick="togglePwd('confirmPassword', this)" tabindex="-1>显示</button>
          </div
      <p class="form-footer">已有账号？<a href="login.html">立即登录</a></p>
    </div>
  </main>

  <script src="register_JS.js"></script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '隐藏'; }
  else { input.type = 'password'; btn.textContent = '显示'; }
}
</script>
</body>
</html>
